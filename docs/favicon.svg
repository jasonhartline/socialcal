  <rect x="40" y="9"  width="7" height="14" rx="3.5" fill="#444"/>

  <!-- Grid lines -->
  <line x1="4"  y1="40" x2="60" y2="40" stroke="#BBBBBB" stroke-width="1.5"/>
  <line x1="4"  y1="52" x2="60" y2="52" stroke="#BBBBBB" stroke-width="1.5"/>
